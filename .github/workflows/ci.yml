name: CI

# 必須ステータスチェック。ブランチ保護 ruleset で main に対しこの CI の
# test を required にする（承認必須は付けない — 1人リポでは自己承認できず
# マージ不能になるため。詳細は dev-env の research-decisions.md）。
#
# unit テストは依存ゼロ・ネットワーク不要（scripts/*.mjs が functions/api/*.ts
# を Node の type stripping で直接 import する）ため npm ci も secrets も不要。
# ライブ tuning matrix（Anthropic キー必要）は CI では実行しない — オーナーが
# ローカルで `node scripts/test-crosscheck.mjs` を実行する（TRY_TOOL_README.md 参照）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR の古い実行はキャンセルして Actions 分数を節約
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest # Windows($0.010/分)ではなく Linux($0.006/分)固定
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # type-stripped .ts import に Node >= 22.18 が必要

      # npm ci は不要（unit テストは依存ゼロ。wrangler は dev 専用 devDependency）

      - name: Unit tests (cross-check)
        run: node scripts/test-crosscheck.mjs --unit

      - name: Unit tests (publish)
        run: node scripts/test-publish.mjs
