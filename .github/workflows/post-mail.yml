# .github/workflows/post-mail.yml
#
# Daily draft mail (docs/post-mail.md). Ticks every hour; scripts/post-mail.mjs
# decides whether this tick sends — the send hour lives in
# scripts/post-mail.config.json (send_hour_jst, default 12 = 12:00 JST), so
# changing the time never touches this file. Once a day per mode is enforced
# by the run log (/api/post-log) and, for live mail, by Resend's
# Idempotency-Key.
#
# Default is DRY RUN: the mail is built and kept as a run artifact, nothing is
# sent. Sending needs Variable POST_MAIL_MODE=live plus the RESEND_API_KEY and
# MAIL_TO secrets. POST_MAIL_MODE=off stops everything (kill switch).
#
# Never posts to X. The mail carries a link that opens X's compose screen with
# the text filled in; the owner posts by hand.

name: post-mail

on:
  workflow_dispatch:
    inputs:
      force:
        description: "送信時刻と1日1回のチェックを無視して今すぐ実行（dry-run / live は POST_MAIL_MODE のまま）"
        type: boolean
        default: false
  schedule:
    # Every hour at :17 (off the :00 rush, where GitHub delays/drops more runs).
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: post-mail
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: stop switch
        id: gate
        env:
          MODE: ${{ vars.POST_MAIL_MODE }}
        run: |
          m="$(printf '%s' "${MODE}" | tr 'A-Z' 'a-z' | tr -d '[:space:]')"
          echo "live=$([ "${m}" = "live" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "${m}" = "off" ]; then
            echo "POST_MAIL_MODE=off — stopped."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 24 # type-stripped .ts import needs Node >= 22.18

      - name: build (and send when live)
        if: steps.gate.outputs.go == 'true'
        env:
          POST_MAIL_MODE: ${{ vars.POST_MAIL_MODE }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          POST_MAIL_BLOCK_WORDS: ${{ secrets.POST_MAIL_BLOCK_WORDS }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node scripts/post-mail.mjs ${FORCE}

      # Dry-run only: the built mail (no address in it) — what it "would have
      # sent". Skipped when live (the mail itself is the copy), because
      # artifacts of a public repo are readable by any signed-in GitHub user.
      - name: keep the dry-run mail as an artifact
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.live != 'true' && hashFiles('out/post-mail/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-mail-${{ github.run_id }}
          path: out/post-mail/
          retention-days: 14
