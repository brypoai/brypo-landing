# .github/workflows/post-notify.yml
#
# Daily draft notification (docs/post-notify.md). Ticks every 15 minutes;
# scripts/post-notify.mjs decides whether this tick acts — the send hour, the
# preparation lead and the default mode live in scripts/post-notify.config.json
# (send_hour_jst, default 12 = 12:00 JST; lead_hours, default 6; mode), so
# changing them never touches this file. Once a day is enforced by the run log
# (/api/post-log).
#
# Why 15 minutes and a lead: GitHub runs scheduled workflows late (1.5–5 h on
# this repo's x-reply history) or drops them (1 of ~7 hourly ticks fired on the
# first day). The first tick that lands inside the lead window prepares the
# draft and hands it to ntfy with a `delay`, so the phone gets it exactly at
# send_hour no matter when the tick ran; a tick after send_hour sends at once.
#
# Sends to the owner's phone via ntfy (secret NTFY_TOPIC, already used by
# x-reply.yml). Variable POST_NOTIFY_MODE overrides the config: "live" sends,
# "off" stops everything (kill switch).
#
# Never posts to X. Tapping the notification opens X's compose screen with
# the text filled in; the owner posts by hand.

name: post-notify

on:
  workflow_dispatch:
    inputs:
      force:
        description: "通知時刻と1日1回のチェックを無視して今すぐ実行（dry-run / live の切り替えはそのまま）"
        type: boolean
        default: false
  schedule:
    # Every 15 minutes, off the :00/:15/:30/:45 marks where GitHub queues pile up.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: post-notify
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: stop switch
        id: gate
        env:
          MODE: ${{ vars.POST_NOTIFY_MODE }}
        run: |
          m="$(printf '%s' "${MODE}" | tr 'A-Z' 'a-z' | tr -d '[:space:]')"
          if [ "${m}" = "off" ]; then
            echo "POST_NOTIFY_MODE=off — stopped."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 24 # type-stripped .ts import needs Node >= 22.18

      - name: build (and send when live)
        if: steps.gate.outputs.go == 'true'
        env:
          POST_NOTIFY_MODE: ${{ vars.POST_NOTIFY_MODE }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POST_NOTIFY_BLOCK_WORDS: ${{ secrets.POST_NOTIFY_BLOCK_WORDS }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node scripts/post-notify.mjs ${FORCE}
