# .github/workflows/x-reply.yml
#
# Daily driver for the X reply-CANDIDATE lister (@kokibuilds). POSTs
# {"dry_run": true} + lang:ja queries twice a day (07:00 / 22:00 JST); the endpoint only lists
# candidates into the digest — no drafting (Anthropic call removed 2026-08-10)
# and it never posts to X (send path severed at code level 2026-08-10;
# non-dry_run gets 400). The human replies in the X app. Afterwards one ntfy
# notification (same method as claude-ops bin/notify.sh) reports the count —
# sent even when zero.

name: x-reply

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC = 07:00 JST (next morning), daily. Best-effort; minute may drift.
    - cron: "0 22 * * *"
    # 13:00 UTC = 22:00 JST — evening pass so the 20-24 JST cluster isn't pushed out by MAX_PER_RUN.
    - cron: "0 13 * * *"

permissions: {}

concurrency:
  group: x-reply
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: list reply candidates (dry_run pass)
        env:
          TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [ -z "${TOKEN}" ] && { echo "PUBLISH_TOKEN not set — skipping."; exit 0; }
          # lang:ja discovery queries (retuned 2026-08-16 against 49 measured
          # candidates from 08-14: 31% were usable, and the bare "#個人開発"
          # query produced most of the noise — bot digests, affiliate listicles
          # and AI-art posts that merely carry the tag. Dropped it. The other
          # two now ask for what actually read as build-in-public: a shipped
          # thing, a number, or a stuck point someone can be answered about.)
          BODY=$(jq -n '{dry_run: true, queries: [
            "\"個人開発\" (リリース OR 公開 OR ローンチ OR 出しました) -is:retweet -is:reply lang:ja",
            "\"個人開発\" (売上 OR 収益 OR MRR OR ユーザー数 OR 継続率 OR 進捗) -副業 -投資 -せどり -is:retweet -is:reply lang:ja",
            "(個人開発 OR インディーハッカー) (悩ん OR 詰まっ OR 迷っ OR どう思い) -is:retweet -is:reply lang:ja"
          ]}')
          echo "POST /api/x-reply/run  body=${BODY}"
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            https://brypo.com/api/x-reply/run \
            -H "X-Publish-Token: ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}") || { echo "curl failed"; exit 1; }
          echo "HTTP ${code}"
          cat resp.json 2>/dev/null || true
          echo
          case "${code}" in
            200) echo "ok" ;;
            503) echo "reply-engine disabled (X_REPLY_ENABLED) — no-op" ; exit 0 ;;
            401) echo "unauthorized — PUBLISH_TOKEN in Actions does not match Cloudflare Pages" ; exit 1 ;;
            *)   echo "unexpected status ${code}" ; exit 1 ;;
          esac

      - name: notify (ntfy — same method as claude-ops bin/notify.sh)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          [ -z "${NTFY_TOPIC}" ] && { echo "NTFY_TOPIC not set — skipping notify."; exit 0; }
          N=$(jq -r '.listed // 0' resp.json 2>/dev/null || echo 0)
          MSG="候補0件。TLから手動で10件"
          # リンク先は API ではなく閲覧ページ /ops/。digest はトークンを
          # X-Publish-Token ヘッダでしか受け取らないため、API URL を直接開くと
          # ブラウザはヘッダを付けられず必ず 401 になる（2026-08-15 実地で確認）。
          # /ops/ は保存済みトークンをヘッダに載せて fetch する。
          [ "${N}" -gt 0 ] && MSG="今日の返信候補 ${N} 件 https://brypo.com/ops/?xr=$(date -u +%F)" || true
          curl -fsS -o /dev/null -H "Title: x-reply candidates" -H "Priority: default" \
            -d "${MSG}" "https://ntfy.sh/${NTFY_TOPIC}" || echo "notify: send failed"
