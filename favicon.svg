<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0f"/>
  
  <!-- Stylized 'B' as a fanned-out branching shape — proof radiating out -->
  <g transform="translate(32, 32)" fill="none" stroke="#e8553b" stroke-width="3.5" stroke-linecap="round">
    <!-- Central vertical -->
    <line x1="-9" y1="-15" x2="-9" y2="15"/>
    <!-- Three radiating arcs (representing the 5-format fan-out) -->
    <path d="M -9 -10 Q 4 -10, 8 -2"/>
    <path d="M -9 0 Q 6 0, 11 0"/>
    <path d="M -9 10 Q 4 10, 8 2"/>
  </g>
  
  <!-- Accent dot -->
  <circle cx="48" cy="48" r="2.5" fill="#e8553b"/>
</svg>
