<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a1015" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Subtle noise pattern -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.96  0 0 0 0 0.96  0 0 0 0 0.94  0 0 0 0.04 0"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.5"/>
  
  <!-- Top label -->
  <g transform="translate(80, 80)">
    <circle cx="6" cy="-3" r="5" fill="#e8553b"/>
    <text x="20" y="0" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="500" fill="#6b6b75" letter-spacing="2">
      COMING SOON · 2026
    </text>
  </g>
  
  <!-- Brand mark -->
  <text x="80" y="320" font-family="'Fraunces', 'Times New Roman', serif" font-size="220" font-weight="900" fill="#f5f5f0" letter-spacing="-12">
    Brypo<tspan fill="#e8553b" font-weight="500" font-style="italic">.</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="80" y="410" font-family="'Fraunces', 'Times New Roman', serif" font-size="42" font-style="italic" font-weight="500" fill="#f5f5f0" letter-spacing="-1">
    Bring Your Proof Out.
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="465" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="22" fill="#b8b8b0" letter-spacing="0">
    One source. Five stories.
  </text>
  
  <!-- Format chips at bottom -->
  <g transform="translate(80, 540)">
    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16" fill="#b8b8b0">
      <!-- Chip 1 -->
      <rect x="0" y="-22" width="200" height="36" rx="18" fill="none" stroke="#1f1f2a" stroke-width="1.5"/>
      <text x="20" y="2">→ Investor update</text>
      
      <!-- Chip 2 -->
      <rect x="215" y="-22" width="170" height="36" rx="18" fill="none" stroke="#1f1f2a" stroke-width="1.5"/>
      <text x="235" y="2">→ Hiring post</text>
      
      <!-- Chip 3 -->
      <rect x="400" y="-22" width="195" height="36" rx="18" fill="none" stroke="#1f1f2a" stroke-width="1.5"/>
      <text x="420" y="2">→ Customer case</text>
      
      <!-- Chip 4 -->
      <rect x="610" y="-22" width="155" height="36" rx="18" fill="none" stroke="#1f1f2a" stroke-width="1.5"/>
      <text x="630" y="2">→ X thread</text>
      
      <!-- Chip 5 -->
      <rect x="780" y="-22" width="180" height="36" rx="18" fill="none" stroke="#e8553b" stroke-width="1.5"/>
      <text x="800" y="2" fill="#e8553b">→ Internal doc</text>
    </g>
  </g>
  
  <!-- URL bottom right -->
  <text x="1120" y="600" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16" fill="#6b6b75" letter-spacing="1">
    brypo.com
  </text>
</svg>
